<button matIconButton type="button" aria-label="Menú de usuario" [matMenuTriggerFor]="menu">
  <app-avatar [label]="user().initials" size="small" />
</button>

<mat-menu #menu="matMenu" xPosition="before" class="w-15rem">
  <div class="flex align-items-center gap-2 px-3 py-2">
    <app-avatar [label]="user().initials" />
    <div class="flex flex-column min-w-0">
      <span class="font-semibold">{{ user().name }}</span>
      <span class="text-sm text-color-secondary white-space-nowrap overflow-hidden text-overflow-ellipsis">
        {{ user().email }}
      </span>
    </div>
  </div>
  <mat-divider />
  <button mat-menu-item type="button">
    <mat-icon>person</mat-icon>
    <span>Perfil</span>
  </button>
  <button mat-menu-item type="button">
    <mat-icon>settings</mat-icon>
    <span>Configuración</span>
  </button>
  <mat-divider />
  <button mat-menu-item type="button" (click)="auth.logout()">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>
