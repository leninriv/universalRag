<!-- Título del chat en la barra superior global -->
<ng-template appTopbarContent>
  <p-button
    styleClass="lg:hidden"
    icon="pi pi-history"
    [text]="true"
    [rounded]="true"
    severity="secondary"
    ariaLabel="Ver historial"
    (onClick)="historyVisible.set(true)"
  />
  <h1 class="m-0 text-lg font-semibold white-space-nowrap overflow-hidden text-overflow-ellipsis">
    {{ title() }}
  </h1>
</ng-template>

<div class="flex h-full">
  <!-- Historial (desktop) -->
  <aside class="hidden lg:flex flex-column flex-shrink-0 w-17rem surface-ground border-right-1 surface-border">
    <app-chat-history class="flex-1 min-h-0" />
  </aside>

  <section class="flex-1 min-w-0 surface-card">
    <router-outlet />
  </section>
</div>

<!-- Historial (mobile) -->
<p-sidebar [(visible)]="historyVisible" styleClass="app-drawer w-20rem">
  <ng-template pTemplate="header">
    <span class="font-semibold text-lg">Historial</span>
  </ng-template>
  <app-chat-history class="h-full" />
</p-sidebar>
