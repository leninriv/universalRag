@if (message().role === 'user') {
  <div class="flex justify-content-end">
    <div class="message-text user-bubble border-round-3xl px-4 py-2 line-height-3">{{ message().content }}</div>
  </div>
} @else {
  <div class="flex gap-3">
    <app-avatar icon="auto_awesome" variant="accent" />
    <div class="flex-1 min-w-0">
      <div class="message-text line-height-3 pt-2">{{ message().content }}</div>
      <div class="flex mt-1 -ml-2">
        <button
          matIconButton
          type="button"
          aria-label="Copiar respuesta"
          [matTooltip]="copied() ? 'Copiado' : 'Copiar'"
          (click)="copy()"
        >
          <mat-icon>{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
        </button>
      </div>
    </div>
  </div>
}
