<div class="flex flex-column align-items-center text-center max-w-30rem">
  <app-avatar [icon]="icon()" size="xlarge" variant="accent" class="mb-4" />
  <mat-chip-set class="mb-3" aria-label="Módulo">
    <mat-chip highlighted disableRipple>{{ moduleName() }}</mat-chip>
  </mat-chip-set>
  <h1 class="text-4xl font-bold m-0 mb-3">Coming soon</h1>
  <p class="text-color-secondary line-height-3 m-0">{{ description() }}</p>
</div>
