<div #scroller class="flex-1 min-h-0 overflow-y-auto">
  <div class="app-content-column flex flex-column min-h-full px-3 py-4">
    @for (message of messages(); track message.id) {
      <app-chat-message [message]="message" />
    } @empty {
      @if (loadingMessages()) {
        <div class="flex flex-column gap-3 pt-3">
          <div class="app-skeleton" style="width: 60%"></div>
          <div class="app-skeleton" style="width: 85%"></div>
          <div class="app-skeleton" style="width: 40%"></div>
        </div>
      } @else {
        <app-chat-empty-state class="flex-1" (promptSelected)="send($event)" />
      }
    }

    @if (awaitingReply()) {
      <app-chat-typing-indicator />
    }
  </div>
</div>

<div class="app-content-column px-3 pb-3">
  <app-chat-composer [disabled]="awaitingReply()" (submitted)="send($event)" />
</div>
