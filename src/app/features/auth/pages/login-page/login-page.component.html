<div class="relative flex align-items-center justify-content-center min-h-screen surface-ground p-3">
  <div class="absolute top-0 right-0 p-3">
    <app-theme-toggle />
  </div>

  <mat-card appearance="outlined" class="w-full p-3" style="max-width: 24rem">
    <mat-card-content>
      <div class="flex flex-column align-items-center gap-1 mb-4 text-center">
        <app-brand />
        <p class="m-0 mt-2 text-color-secondary">Inicia sesión para continuar</p>
      </div>

      <form class="flex flex-column gap-2" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (error(); as message) {
          <div class="app-callout app-callout-error mb-2" role="alert">
            <mat-icon>error</mat-icon>
            <span>{{ message }}</span>
          </div>
        }

        <mat-form-field appearance="outline">
          <mat-label>Correo electrónico</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" placeholder="nombre@empresa.com" />
          <mat-error>Ingresa un correo válido.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            matIconButton
            matSuffix
            type="button"
            [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="passwordVisible()"
            (click)="passwordVisible.update((visible) => !visible)"
          >
            <mat-icon>{{ passwordVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>Ingresa tu contraseña.</mat-error>
        </mat-form-field>

        <button matButton="filled" type="submit" class="w-full" [showProgress]="loading()" [disabled]="loading()">
          <mat-progress-spinner progressIndicator mode="indeterminate" diameter="20" />
          Iniciar sesión
        </button>
      </form>

      @if (mockCredentials; as demo) {
        <div class="app-callout mt-3 text-sm">
          <mat-icon>info</mat-icon>
          <span>Modo demo: <b>{{ demo.email }}</b> / <b>{{ demo.password }}</b></span>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
